name: package-macOS

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    strategy:
      matrix:
        os: [macos-latest]
        haxe: [4.3.3]
      fail-fast: true
    runs-on: macos-latest

    steps:
      # Checkout, install haxe and libs
      - uses: actions/checkout@v2
      - uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ matrix.haxe }}
      - run: haxe -version
      - run: haxe setup.hxml
      - run: haxelib list

      # Node/NPM commands
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: cd app && npm install
      - run: cd app && npm run pack-prepare
      - run: cd app && npm run pack-macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Rename universal macOS installer
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(find app/redist -maxdepth 1 -type f -name 'LDtk*installer.dmg' | head -n 1)
          if [ -z "$DMG" ]; then
            echo "No macOS DMG was produced"
            exit 1
          fi
          cp "$DMG" "LDtk-1.5.3-Aseprite-Atlas-Composer-macOS-universal.dmg"

      - name: Add macOS build to test release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="aseprite-atlas-composer-test"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "LDtk-1.5.3-Aseprite-Atlas-Composer-macOS-universal.dmg" \
              --clobber
          else
            gh release create "$TAG" \
              "LDtk-1.5.3-Aseprite-Atlas-Composer-macOS-universal.dmg" \
              --target "master" \
              --title "LDtk 1.5.3 - Aseprite + Atlas Composer test build" \
              --notes "Experimental test build of the RondeI33 LDtk fork with robust Aseprite tileset support and the selective Atlas Composer. This release includes the universal macOS DMG for both Apple Silicon and Intel Macs." \
              --prerelease
          fi

      # Upload Actions artifact too
      - uses: actions/upload-artifact@v7
        with:
          name: mac-distribution
          path: LDtk-1.5.3-Aseprite-Atlas-Composer-macOS-universal.dmg
